<layout-default [title]="'Уведомления'">
  <div actions>
    @if (items !== undefined && items.length > 0) {
      <button
        mat-button
        color="accent"
        (click)="removeAll($event)"
        >
        <mat-icon>delete</mat-icon>
        Удалить все уведомления
      </button>
    }
  </div>

  @if (items !== undefined && items.length > 0) {
    <div class="notification-list">
      <div class="notification-list-items">
        @for (item of items; track item) {
          <notification-item [notification]="item"></notification-item>
        }
      </div>
      <div class="notification-list-filter">
        <div class="notification-list-filter-title">Фильтры</div>
        <mat-card-content> </mat-card-content>
        <mat-card-footer> </mat-card-footer>
      </div>
    </div>
    <mat-paginator
      [length]="pageSettings.length"
      [pageSize]="pageSettings.pageSize"
      [pageSizeOptions]="[5, 10, 25, 100]"
      (page)="setPageSettings($event)"
      aria-label="Select page"
      >
    </mat-paginator>
  } @else {
    <mat-list role="list">
      <mat-list-item role="listitem"> Нет уведомлений </mat-list-item>
    </mat-list>
  }

</layout-default>
