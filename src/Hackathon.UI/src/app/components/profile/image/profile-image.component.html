@if (user) {
  @if (!user?.image) {
    <div class="noSelect" [innerText]="user.shortUserName"></div>
  }
  @if (user.image) {
    <img (error)="onImgError()" [src]="user.image" alt="photo" />
  }
  <input type="file" #selectedFile (change)="selectFile($event)" />
  @if (canUpload) {
    <button (click)="selectedFile.click()">
      <mat-icon>photo_camera</mat-icon>
    </button>
  }
}
