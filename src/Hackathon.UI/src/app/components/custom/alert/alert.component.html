<div class="alert {{ icon }}">
  <div class="icon">
    @if (showIcon) {
      <mat-icon [innerText]="icon"></mat-icon>
    }
  </div>
  <div>
    <div><ng-content></ng-content></div>
    @if (closeable) {
      <mat-icon (click)="isClosed = true" class="alert-close">close</mat-icon>
    }
  </div>
</div>
